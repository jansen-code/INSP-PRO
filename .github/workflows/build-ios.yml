name: Compilar iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Selecionar Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Usando: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissao ao Gradle
        run: chmod +x gradlew

      - name: Compilar e linkar framework iOS (Device Arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --no-daemon

      - name: Compilar app iOS via Xcode (Device)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/xcode-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO

      - name: Localizar .app, criar Payload e gerar .ipa
        run: |
          # 1. Localiza a pasta INSPETOR.app
          APP_PATH=$(find build/xcode-derived -name "INSPETOR.app" -type d | head -1)
          echo "App encontrada em: $APP_PATH"
          
          # 2. Entra na pasta onde ela esta
          cd "$(dirname "$APP_PATH")"
          
          # 3. Cria a estrutura Payload e move o app
          mkdir -p Payload
          mv INSPETOR.app Payload/
          
          # 4. Compacta no formato correto .ipa
          zip -qr INSPETOR.ipa Payload
          
          # 5. Move o .ipa pronto para a raiz do projeto
          mv INSPETOR.ipa $GITHUB_WORKSPACE/

      - name: Upload artefato IPA
        uses: actions/upload-artifact@v4
        with:
          name: INSPETOR-ios-device
          path: INSPETOR.ipa
          if-no-files-found: error
          retention-days: 14
